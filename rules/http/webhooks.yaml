# HTTP Gateway Example Rules
# Demonstrates HTTP ↔ NATS bidirectional integration

# ============================================================================
# INBOUND WEBHOOKS (HTTP → NATS)
# ============================================================================

# Example 1: GitHub Pull Request Webhook
- trigger:
    http:
      path: "/webhooks/github/pr"
      method: "POST"
  conditions:
    operator: and
    items:
      - field: "{@header.X-GitHub-Event}"
        operator: eq
        value: "pull_request"
      - field: "{action}"
        operator: eq
        value: "opened"
  action:
    nats:
      subject: "github.pr.{repository.name}.opened"
      payload: |
        {
          "event": "pr_opened",
          "repo": "{repository.name}",
          "pr_number": {number},
          "author": "{user.login}",
          "title": "{pull_request.title}",
          "url": "{pull_request.html_url}",
          "timestamp": "{@timestamp()}",
          "event_id": "{@uuid7()}"
        }
      headers:
        X-Source: "github-webhook"
        X-Event-Type: "pull_request"

# Example 2: Generic Webhook Router
- trigger:
    http:
      path: "/webhooks/generic"
      method: "POST"
  action:
    nats:
      subject: "webhooks.received.{@method}"
      payload: |
        {
          "path": "{@path}",
          "method": "{@method}",
          "data": {data},
          "received_at": "{@timestamp()}"
        }

# Example 3: Stripe Webhook
- trigger:
    http:
      path: "/webhooks/stripe"
      method: "POST"
  conditions:
    operator: and
    items:
      - field: "{type}"
        operator: eq
        value: "payment_intent.succeeded"
  action:
    nats:
      subject: "payments.stripe.success"
      payload: |
        {
          "payment_id": "{data.object.id}",
          "amount": {data.object.amount},
          "currency": "{data.object.currency}",
          "customer": "{data.object.customer}",
          "timestamp": "{@timestamp()}"
        }

# Example 4: Multi-tenant webhook with a wildcard path
# `*` matches exactly one path segment (same semantics as NATS subject
# wildcards), so one rule serves every tenant; {@path.1} recovers the segment.
- trigger:
    http:
      path: "/webhooks/*/events"
      method: "POST"
  action:
    nats:
      subject: "tenants.{@path.1}.events"
      payload: |
        {
          "tenant": "{@path.1}",
          "event_type": "{type}",
          "data": {data},
          "timestamp": "{@timestamp()}"
        }
      headers:
        X-Tenant-ID: "{@path.1}"

# Example 4.5: Multi-level wildcard — `>` matches everything after the prefix.
# Catch-all audit trail for an API subtree.
- trigger:
    http:
      path: "/internal-api/>"
  action:
    nats:
      subject: "audit.http.{@method}"
      payload: |
        {
          "path": "{@path}",
          "method": "{@method}",
          "received_at": "{@timestamp()}"
        }

# Example 4.6: Query parameters — {@query.name} reads the request URL's query
# string. Names are case-sensitive, values are always strings, and a repeated
# name keeps only its first value.
#
# Query data lives in its own namespace and is NEVER merged into the message, so
# a caller cannot append ?device_id=x to shadow a body field. Query also has no
# effect on which rule matches — routing keys off the path alone.
#
#   curl -X POST "http://localhost:8080/webhooks/acme?tenant=acme&source=edge" \
#     -H 'Content-Type: application/json' -d '{"reading": 42}'
- trigger:
    http:
      path: "/webhooks/acme"
      method: "POST"
  conditions:
    operator: and
    items:
      - field: "{@query.tenant}"
        operator: exists
  action:
    nats:
      subject: "ingest.{@query.tenant}.readings"
      payload: |
        {
          "tenant": "{@query.tenant}",
          "source": "{@query.source}",
          "reading": {reading},
          "received_at": "{@timestamp()}"
        }

# Example 4.7: Form-encoded body — a Content-Type of
# application/x-www-form-urlencoded decodes the body into normal message fields,
# so {device_id} works exactly as it would for JSON. This is what HTML form
# posts and many embedded/industrial devices send.
#
# Every value is a string (types are never inferred — a PIN of "007" must not
# become 7), but conditions coerce, so `gte: 80` below works against "93".
# Quote optional fields in templates: an unresolved variable renders empty, so
# "card": {card_value} would produce invalid JSON when the field is omitted.
#
#   curl -X POST http://localhost:8080/devices/identified \
#     -H 'Content-Type: application/x-www-form-urlencoded' \
#     -d 'device_id=9876&user_id=42&user_name=Neal+Caffrey&confidence=93'
- trigger:
    http:
      path: "/devices/identified"
      method: "POST"
  conditions:
    operator: and
    items:
      - field: "{confidence}"
        operator: gte
        value: 80
  action:
    nats:
      subject: "access.{device_id}.identified"
      payload: |
        {
          "deviceId": {device_id},
          "userId": {user_id},
          "userName": "{user_name}",
          "confidence": "{confidence}",
          "cardValue": "{card_value}",
          "receivedAt": "{@timestamp()}"
        }

# ============================================================================
# SYNCHRONOUS HTTP RESPONSES (respond action)
# ============================================================================

# Example 4a: Synchronous response — evaluate, enrich from KV, reply in one call.
# The `respond` action's payload is written back as the HTTP response body
# instead of fire-and-forget publishing to NATS.
- trigger:
    http:
      path: "/api/quote"
      method: "POST"
  conditions:
    operator: and
    items:
      - field: "{@header.Content-Type}"
        operator: eq
        value: "application/json"
  action:
    respond:
      statusCode: 200
      headers:
        Content-Type: "application/json"
      payload: |
        {
          "symbol": "{symbol}",
          "price": {@kv.prices.{symbol}:last},
          "asOf": "{@timestamp()}",
          "quoteId": "{@uuid7()}"
        }

# Example 4b: HTTP↔NATS bridge — turn the request into a NATS request, wait for a
# responder, and return the reply as the HTTP response. No responder → 503,
# timeout → 504. `request: true` is only honored on HTTP triggers.
- trigger:
    http:
      path: "/api/geocode"
      method: "POST"
  conditions:
    operator: and
    items:
      - field: "{@header.X-Api-Key}"
        operator: eq
        value: "expected-key"
  action:
    nats:
      subject: "services.geocode"
      request: true
      timeout: "3s"

# ============================================================================
# OUTBOUND WEBHOOKS (NATS → HTTP)
# ============================================================================

# Example 5: Critical Alerts to PagerDuty
- trigger:
    nats:
      subject: "alerts.critical.>"
  conditions:
    operator: and
    items:
      - field: "{severity}"
        operator: gte
        value: 9
      # Only during business hours
      - field: "{@time.hour}"
        operator: gte
        value: 9
      - field: "{@time.hour}"
        operator: lt
        value: 17
  action:
    http:
      url: "https://events.pagerduty.com/v2/enqueue"
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Token token=YOUR_PAGERDUTY_TOKEN"
      payload: |
        {
          "routing_key": "YOUR_ROUTING_KEY",
          "event_action": "trigger",
          "payload": {
            "summary": "{message}",
            "severity": "critical",
            "source": "{@subject}",
            "timestamp": "{@timestamp()}",
            "custom_details": {
              "alert_id": "{alert_id}",
              "service": "{service}",
              "host": "{host}"
            }
          }
        }
      retry:
        maxAttempts: 3
        initialDelay: "1s"
        maxDelay: "10s"

# Example 6: Slack Notifications
- trigger:
    nats:
      subject: "notifications.slack.>"
  action:
    http:
      url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload: |
        {
          "text": "📢 {message}",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Alert*: {message}\n*Time*: {@timestamp()}"
              }
            }
          ]
        }
      retry:
        maxAttempts: 3
        initialDelay: "500ms"
        maxDelay: "5s"

# Example 7: Webhook with KV Enrichment
- trigger:
    nats:
      subject: "orders.premium.>"
  conditions:
    operator: and
    items:
      - field: "{@kv.customers.{customer_id}:tier}"
        operator: eq
        value: "premium"
  action:
    http:
      url: "https://api.example.com/orders"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-API-Key: "YOUR_API_KEY"
        X-Customer-Tier: "premium"
      payload: |
        {
          "order_id": "{order_id}",
          "customer_id": "{customer_id}",
          "customer_name": "{@kv.customers.{customer_id}:name}",
          "account_manager": "{@kv.customers.{customer_id}:account_manager}",
          "amount": {amount},
          "timestamp": "{@timestamp()}"
        }
      retry:
        maxAttempts: 5
        initialDelay: "1s"
        maxDelay: "30s"

# Example 8: Passthrough Webhook (forward unchanged)
- trigger:
    nats:
      subject: "webhooks.forward.>"
  action:
    http:
      url: "https://api.downstream.com/events"
      method: "POST"
      passthrough: true
      headers:
        Authorization: "Bearer YOUR_TOKEN"
        X-Forwarded-From: "http-gateway"
      retry:
        maxAttempts: 3
        initialDelay: "1s"
        maxDelay: "10s"

# Example 9: Time-based webhook delivery
- trigger:
    nats:
      subject: "reports.daily"
  conditions:
    operator: and
    items:
      # Only at 9 AM
      - field: "{@time.hour}"
        operator: eq
        value: 9
      - field: "{@time.minute}"
        operator: lt
        value: 5
      # Weekdays only
      - field: "{@day.name}"
        operator: not_in
        value: ["saturday", "sunday"]
  action:
    http:
      url: "https://api.example.com/reports"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload: |
        {
          "report_date": "{@date.iso}",
          "report_type": "daily_summary",
          "data": {data},
          "generated_at": "{@timestamp()}"
        }
      retry:
        maxAttempts: 3
        initialDelay: "2s"
        maxDelay: "20s"
