name: Release

# Push a tag to release: commit the CHANGELOG.md section for the version,
# then `git tag vX.Y.Z && git push origin vX.Y.Z`. Don't also run
# `goreleaser release` locally — both would publish to the same release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs history and tags

      # Latest stable, not go.mod's minimum: the binaries ship with this
      # toolchain's standard library, so they should carry its security fixes.
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # The release body is the version's hand-written CHANGELOG.md section
      # rather than goreleaser's commit list. A tag without a section is a
      # mistake, so stop before building anything.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: go test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Container images for amd64 and arm64 (edge routers such as Peplink run
  # arm64 only), pushed to ghcr.io/<owner>/<app> as X.Y.Z, X.Y and latest.
  # Runs after the release so a failed release ships no image. The packages
  # take this public repository's visibility, so devices pull them without
  # credentials.
  images:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [rule-router, nats-auth-manager]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags from the git tag (v0.25.0 -> 0.25.0, 0.25, latest), plus the OCI
      # labels that link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_NAME=${{ matrix.app }}
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
